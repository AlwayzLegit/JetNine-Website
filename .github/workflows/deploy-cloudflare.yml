name: Deploy (Cloudflare)

# Builds the app with the OpenNext adapter and deploys it to Cloudflare
# Workers, then runs the same post-deploy smoke Vercel deploys trigger.
#
#   push to main       → production  (jetnine-web, jetnine.com)
#   workflow_dispatch  → staging or production
#
# Repository secrets:   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID,
#                       NEXT_PUBLIC_SUPABASE_ANON_KEY, DATABASE_URL
# Repository variables: NEXT_PUBLIC_SUPABASE_URL, NEXT_PUBLIC_POSTHOG_KEY,
#                       NEXT_PUBLIC_SENTRY_DSN, NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION
# NEXT_PUBLIC_* values are inlined at build time, so they belong here and
# not only in the Worker's vars/secrets.

on:
  push:
    branches: [main]
    paths-ignore: ["voice/**", "**/*.md", "docs/**"]
  workflow_dispatch:
    inputs:
      target:
        description: Where to deploy
        type: choice
        options: [staging, production]
        default: staging

permissions:
  contents: read
  # smoke-after-deploy.yml asks for this; a called workflow may not request
  # more than its caller grants, or the whole run fails at startup.
  deployments: read
  # The tail job reads the status of the smoke and sitemap jobs of this run
  # (read only) to know when its window can end.
  actions: read

concurrency:
  group: deploy-cloudflare-${{ github.event.inputs.target || 'production' }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      url: ${{ steps.target.outputs.url }}
      environment: ${{ steps.target.outputs.environment }}
    steps:
      - name: Resolve target
        id: target
        run: |
          TARGET="${{ github.event.inputs.target || 'production' }}"
          if [ "$TARGET" = "production" ]; then
            echo "environment=production" >> "$GITHUB_OUTPUT"
            echo "url=https://jetnine.com" >> "$GITHUB_OUTPUT"
            echo "env_flag=" >> "$GITHUB_OUTPUT"
          else
            echo "environment=staging" >> "$GITHUB_OUTPUT"
            echo "url=https://staging.jetnine.com" >> "$GITHUB_OUTPUT"
            echo "env_flag=--env staging" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Staging only (OPS-99): apply the D1 migrations to staging's own
      # database with the repo's own deploy token, then print the table count
      # so the run log is the proof. The production path is unchanged.
      - name: D1 migrations (staging)
        if: steps.target.outputs.environment == 'staging'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          pnpm exec wrangler d1 migrations apply jetnine-staging --env staging --remote
          N=$(pnpm exec wrangler d1 execute jetnine-staging --env staging --remote --json --command "select count(*) as n from sqlite_master where type='table' and name not like 'sqlite_%' and name not like '_cf_%' and name != 'd1_migrations'" | jq -r '.[0].results[0].n')
          echo "D1 jetnine-staging tables: $N"

      # Production (OPS-211, part of the cutover OPS-206): apply the D1 migrations to
      # production's own database BEFORE the app deploy, so the code that reads D1 never
      # ships ahead of its tables (expand and contract: migrate first, then deploy).
      # Prints the table count, so the run log is the proof. A failure here stops the
      # production deploy, which is the point once production reads D1. While production
      # still reads Postgres the migrations only touch the unused D1 database. Same two
      # secrets as the staging step; no new key.
      - name: D1 migrations (production)
        if: steps.target.outputs.environment == 'production'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          pnpm exec wrangler d1 migrations apply jetnine-production --remote
          N=$(pnpm exec wrangler d1 execute jetnine-production --remote --json --command "select count(*) as n from sqlite_master where type='table' and name not like 'sqlite_%' and name not like '_cf_%' and name != 'd1_migrations'" | jq -r '.[0].results[0].n')
          echo "D1 jetnine-production tables: $N"

      - name: Build (OpenNext)
        env:
          # Prerendered pages read the database at build time (social links,
          # empty-leg board, sitemap), as they did on Vercel. Transaction
          # pooler URL, the same value as the DATABASE_URL Worker secret.
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DEPLOY_ENV: ${{ steps.target.outputs.environment }}
          NEXT_PUBLIC_DEPLOY_ENV: ${{ steps.target.outputs.environment }}
          NEXT_PUBLIC_GIT_COMMIT_SHA: ${{ github.sha }}
          NEXT_PUBLIC_SITE_URL: ${{ steps.target.outputs.url }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_POSTHOG_KEY: ${{ vars.NEXT_PUBLIC_POSTHOG_KEY }}
          NEXT_PUBLIC_SENTRY_DSN: ${{ vars.NEXT_PUBLIC_SENTRY_DSN }}
          NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION: ${{ vars.NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION }}
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
        run: pnpm cf:build

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # The deploy command starts a local proxy that refuses to load a
          # Hyperdrive binding without a local connection string. It is only
          # parsed, never connected to.
          CLOUDFLARE_HYPERDRIVE_LOCAL_CONNECTION_STRING_HYPERDRIVE: postgresql://placeholder:placeholder@127.0.0.1:5432/placeholder
        run: >-
          pnpm exec opennextjs-cloudflare deploy ${{ steps.target.outputs.env_flag }}
          --var GIT_COMMIT_SHA:${{ github.sha }}

      # The small Worker that owns the hostnames and caches public pages
      # (edge/worker.ts). Deployed after the app with the released commit,
      # so its cache starts empty and never serves the previous build's HTML.
      - name: Deploy edge cache Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >-
          pnpm exec wrangler deploy -c edge/wrangler.jsonc
          ${{ steps.target.outputs.env_flag || '--env ""' }}
          --var APP_VERSION:${{ github.sha }}

  # The monitor Worker (monitor/, OPS-60): checks the site from outside every
  # 15 minutes and serves /status. Its own job so a failure here never marks
  # the app deploy as failed halfway. Same two secrets as the edge step.
  monitor:
    needs: deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Deploy monitor Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DEPLOY_ENVIRONMENT: ${{ needs.deploy.outputs.environment }}
        run: |
          if [ "$DEPLOY_ENVIRONMENT" = "production" ]; then
            pnpm exec wrangler deploy -c monitor/wrangler.jsonc --env ""
          else
            pnpm exec wrangler deploy -c monitor/wrangler.jsonc --env staging
          fi

  # The staging voice Worker (voice/, OPS-137): jetnine-voice-staging, bound to the staging
  # D1 database that the deploy job above just migrated. It takes no calls (no custom
  # domain, no Twilio, LLM or encryption secret), so its /health answers 503 for the
  # missing settings and that is expected; only its db field is read. The step fails
  # unless the Worker answers with target d1 and ok true. Staging only: the production
  # voice Worker is deployed by hand by the owner (voice/README.md) and is not touched
  # here. Same two secrets as the other Worker steps; if the token cannot create the
  # Worker, the step fails with Cloudflare's own message.
  voice-staging:
    needs: deploy
    if: needs.deploy.outputs.environment == 'staging'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: voice/pnpm-lock.yaml

      - name: Install voice dependencies
        working-directory: voice
        run: pnpm install --frozen-lockfile

      - name: Deploy staging voice Worker
        working-directory: voice
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -o pipefail
          pnpm exec wrangler deploy --env staging 2>&1 | tee deploy.log
          URL=$(grep -oE 'https://jetnine-voice-staging[A-Za-z0-9.-]*workers\.dev' deploy.log | head -n 1)
          URL=${URL:-https://jetnine-voice-staging.jetnine-inc.workers.dev}
          for i in 1 2 3 4 5 6; do
            BODY=$(curl -sS -m 20 "$URL/health" || true)
            T=$(echo "$BODY" | jq -r '.db.target // "none"' 2>/dev/null || echo none)
            OK=$(echo "$BODY" | jq -r '.db.ok // false' 2>/dev/null || echo false)
            echo "voice staging db: target=$T ok=$OK"
            if [ "$T" = "d1" ] && [ "$OK" = "true" ]; then exit 0; fi
            sleep 5
          done
          echo "The staging voice Worker did not answer with target d1 and ok true."
          exit 1

  # Evidence for cut-off requests after a deploy (OPS-104). Tails the two
  # Workers while smoke and sitemap run and prints every event whose outcome
  # is not "ok" (exception, exceededCpu, exceededMemory, canceled,
  # responseStreamDisconnected, ...) with time, method, path without query
  # string and the exception name. It never prints headers, query strings,
  # bodies, log lines or exception messages, and the raw tail is never
  # uploaded. It uses the repo's own deploy token. If the token cannot tail,
  # the job says so in one line and passes: it never fails a deploy.
  # Starts after the deploy job, so the first seconds of the new version can
  # fall before it attaches; its summary says when it attached.
  tail:
    needs: deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Tail the Workers for the post-deploy window
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GH_TOKEN: ${{ github.token }}
          DEPLOY_ENVIRONMENT: ${{ needs.deploy.outputs.environment }}
          RUN_ID: ${{ github.run_id }}
          REPO: ${{ github.repository }}
        run: |
          set +e
          if [ "$DEPLOY_ENVIRONMENT" = "production" ]; then
            EDGE=jetnine-edge; WEB=jetnine-web
          else
            EDGE=jetnine-edge-staging; WEB=jetnine-web-staging
          fi
          mkdir -p "$RUNNER_TEMP/tail"
          ATTACHED=$(date -u +%H:%M:%S)
          # Both tails end by themselves after 6 minutes; they end sooner when
          # the smoke job (and on production the sitemap job) of this run is done.
          timeout 360 pnpm exec wrangler tail "$EDGE" --format json > "$RUNNER_TEMP/tail/edge.jsonl" 2> "$RUNNER_TEMP/tail/edge.err" &
          EDGE_PID=$!
          timeout 360 pnpm exec wrangler tail "$WEB" --format json > "$RUNNER_TEMP/tail/web.jsonl" 2> "$RUNNER_TEMP/tail/web.err" &
          WEB_PID=$!
          sleep 20
          START=$(date +%s)
          while [ $(( $(date +%s) - START )) -lt 340 ]; do
            kill -0 "$EDGE_PID" 2>/dev/null || kill -0 "$WEB_PID" 2>/dev/null || break
            PENDING=$(curl -sS -m 20 -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/$REPO/actions/runs/$RUN_ID/jobs?per_page=50"               | jq -r '[.jobs[]? | select((.name | startswith("smoke")) or (.name | startswith("sitemap"))) | select(.status != "completed")] | length' 2>/dev/null)
            # An empty or non-numeric answer (API trouble) keeps the 6 minute cap.
            if [ "$PENDING" = "0" ] && [ $(( $(date +%s) - START )) -gt 30 ]; then
              sleep 15   # let the last requests of those jobs show up
              break
            fi
            sleep 10
          done
          kill "$EDGE_PID" "$WEB_PID" 2>/dev/null
          wait 2>/dev/null
          {
            echo "Tail attached at $ATTACHED UTC (job time, not the deploy time)."
            if [ ! -s "$RUNNER_TEMP/tail/edge.jsonl" ] && [ ! -s "$RUNNER_TEMP/tail/web.jsonl" ] \
               && grep -qiE "authentication|permission|forbidden|10000|10001|unauthorized" "$RUNNER_TEMP/tail"/*.err 2>/dev/null; then
              echo
              echo "The deploy token cannot tail these Workers (or the tail was refused). No evidence from the Workers this time."
            else
              node scripts/deploy-tail/summarize.mjs "$EDGE=$RUNNER_TEMP/tail/edge.jsonl" "$WEB=$RUNNER_TEMP/tail/web.jsonl"
            fi
          } | tee "$RUNNER_TEMP/tail/deploy-tail-summary.md" >> "$GITHUB_STEP_SUMMARY"
          cat "$RUNNER_TEMP/tail/deploy-tail-summary.md"
          exit 0

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deploy-tail-summary
          path: ${{ runner.temp }}/tail/deploy-tail-summary.md
          if-no-files-found: ignore
          retention-days: 30

  # The warm-up gate (OPS-175): the main pages must answer 200 three times in a row, and
  # /api/health must say ok, before smoke and the sitemap audit start and before the
  # deploy can read green. It reads one data centre (the one nearest the runner), so it
  # catches a rollout that serves 500s near the runner, not every data centre. No secret.
  # tail, monitor and voice-staging stay on `needs: deploy`: the tail must attach early.
  warm:
    needs: deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Warm the main pages
        run: node scripts/deploy-warm/warm.mjs "${{ needs.deploy.outputs.url }}"

  # The shared tier warm-up (OPS-332): after the deploy, read every page of the sitemap once so
  # the edge Worker's shared tier (R2, edge-tier/) holds a copy of each page for this release,
  # and a data centre that has never served a page answers it from the tier instead of waiting
  # for the app to load. It informs and never gates: continue-on-error, the script exits 0, and
  # no other job needs it, so smoke and the sitemap audit do not wait for it. Prints one line,
  # "tier warm: colo XXX, N of M pages 200, MISS a, HIT b, TIER c, STALE d, slowest S s".
  tier-warm:
    needs: [deploy, warm]
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Warm the shared tier
        run: |
          LINE="$(node scripts/deploy-warm/tier.mjs "${{ needs.deploy.outputs.url }}")"
          echo "$LINE"
          echo "$LINE" >> "$GITHUB_STEP_SUMMARY"

  # The site chat's evals (OPS-242), staging only. They run after the staging deploy, before
  # anything can reach production, so a merge never turns the chat on before the never rules
  # have been seen to pass. They ask the public /api/chat of staging (no secret in this job:
  # staging's Turnstile is off or on Cloudflare's test keys). The job prints one line
  # "chat evals: never rules [n]/[n], hand-offs [k]/[m], facts [j]/[l]" and goes red only when
  # a never rule fails (--gate-never) or when staging refused the test token (exit 3, said
  # plainly in the log). Never runs on production: the script refuses any host but staging.
  chat-evals:
    needs: [deploy, warm]
    if: needs.deploy.outputs.environment == 'staging'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Ask the staging chat
        run: |
          set +e
          pnpm exec tsx scripts/chat-evals.mts "${{ needs.deploy.outputs.url }}" --gate-never | tee chat-evals.log
          CODE=${PIPESTATUS[0]}
          grep -E "^(chat evals:|Staging needs)" chat-evals.log >> "$GITHUB_STEP_SUMMARY"
          exit "$CODE"

  smoke:
    needs: [deploy, warm]
    uses: ./.github/workflows/smoke-after-deploy.yml
    with:
      url: ${{ needs.deploy.outputs.url }}
      sha: ${{ github.sha }}
      environment: ${{ needs.deploy.outputs.environment }}
    secrets: inherit

  sitemap:
    needs: [deploy, warm]
    if: needs.deploy.outputs.environment == 'production'
    uses: ./.github/workflows/sitemap-monitor.yml
