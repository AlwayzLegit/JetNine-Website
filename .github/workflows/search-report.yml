name: Search results report

# What Google shows people for jetnine.com, from the Search Console API: clicks,
# impressions, click rate and average position for the last 28 days against the
# 28 before, the top searches and pages, the biggest movers, the searches at
# position 5 to 20 (the cheapest wins) and pages seen but not clicked.
# Copied from Weedtip's workflow (AlwayzLegit/weedtip df9fdbe, OPS-24) for OPS-36.
# See scripts/search-report/report.mjs and docs/search-report.md.
#
# One alarm fails the run red: "ALARM impressions" (the 2 newest final days are
# both below 30 percent of their weekday baseline, baseline at least 100 a day).
# Search Console's final data is about 2 days behind, so no run can say "today".
# Runs Monday, Wednesday and Friday; the full report on Mondays and on manual
# runs, the alarm check on every run. Everything else is a finding.
#
# No secret yet is not a failure: the run stays green with one line, "not
# configured". The secret is the owner step OPS-25.
#
# Search terms: printed and stored only when the repository is private, or when
# SHOW_TERMS_ON_PUBLIC below is "true" (the owner's choice, OPS-25). Otherwise
# every list of searches is replaced by one "search terms withheld" line.
#
# Secret: GSC_SERVICE_ACCOUNT_JSON, read-only scope, in the env of the one step
# that calls Google, never printed. Every step after the unit tests is skipped
# for a pull request, so the key can never be in a pull request run.
#
# Cost: 3 runs a week, each under a minute, no install, no dependency.
# Silence it: GitHub, Actions, Search results report, Disable workflow.

on:
  schedule:
    - cron: '31 15 * * 1,3,5' # Mon, Wed, Fri 07:31 PST
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/search-report/**'
      - '.github/workflows/search-report.yml'

permissions:
  contents: read
  actions: read

concurrency:
  group: search-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      # Set to "true" only on the owner's answer in OPS-25.
      SHOW_TERMS_ON_PUBLIC: 'false'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Unit tests
        run: node --test scripts/search-report/report.test.mjs

      - name: Fetch the last report
        if: ${{ github.event_name != 'pull_request' }}
        run: |
          # Latest successful run of this workflow on main; quiet when there is none.
          id=$(gh api "repos/${{ github.repository }}/actions/workflows/search-report.yml/runs?branch=main&status=success&per_page=1" --jq '.workflow_runs[0].id // empty' 2>/dev/null || true)
          if [ -n "$id" ]; then
            gh run download "$id" --repo "${{ github.repository }}" -n search-report-latest -D previous >/dev/null 2>&1 || echo "No search-report-latest artifact in run ${id}"
          else
            echo "No earlier search-report run"
          fi

      - name: Decide whether search terms may be shown
        if: ${{ github.event_name != 'pull_request' }}
        id: terms
        run: |
          show=false
          if [ "$SHOW_TERMS_ON_PUBLIC" = "true" ]; then
            show=true
          else
            # Only a private repository keeps what people typed out of public view.
            private=$(gh api "repos/${{ github.repository }}" --jq .private 2>/dev/null || echo false)
            if [ "$private" = "true" ]; then show=true; fi
          fi
          echo "show=$show" >> "$GITHUB_OUTPUT"
          echo "Search terms shown: $show"

      - name: Search results report
        if: ${{ github.event_name != 'pull_request' }}
        env:
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
          GSC_DOMAIN: jetnine.com
          GSC_SITE_URL: ${{ vars.GSC_SITE_URL }}
          SHOW_SEARCH_TERMS: ${{ steps.terms.outputs.show }}
        run: |
          args=(--out search-report.json)
          # The full report on Mondays and on any manual run.
          if [ "${{ github.event_name }}" != "schedule" ] || [ "$(date -u +%u)" = "1" ]; then
            args+=(--report)
          fi
          if [ -f previous/search-report.json ]; then args+=(--previous previous/search-report.json); fi
          node scripts/search-report/report.mjs "${args[@]}"

      - name: Keep the numbers for next time
        if: ${{ always() && github.ref == 'refs/heads/main' && hashFiles('search-report.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: search-report-latest
          path: search-report.json
          retention-days: 90
