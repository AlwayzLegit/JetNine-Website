name: Deploy (Cloudflare)

# Builds the app with the OpenNext adapter and deploys it to Cloudflare
# Workers, then runs the same post-deploy smoke Vercel deploys trigger.
#
#   push to main       → production  (jetnine-web, jetnine.com)
#   workflow_dispatch  → staging or production
#
# Repository secrets:   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID,
#                       NEXT_PUBLIC_SUPABASE_ANON_KEY, DATABASE_URL
# Repository variables: NEXT_PUBLIC_SUPABASE_URL, NEXT_PUBLIC_POSTHOG_KEY,
#                       NEXT_PUBLIC_SENTRY_DSN, NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION
# NEXT_PUBLIC_* values are inlined at build time, so they belong here and
# not only in the Worker's vars/secrets.

on:
  push:
    branches: [main]
    paths-ignore: ["voice/**", "**/*.md", "docs/**"]
  workflow_dispatch:
    inputs:
      target:
        description: Where to deploy
        type: choice
        options: [staging, production]
        default: staging

permissions:
  contents: read
  # smoke-after-deploy.yml asks for this; a called workflow may not request
  # more than its caller grants, or the whole run fails at startup.
  deployments: read

concurrency:
  group: deploy-cloudflare-${{ github.event.inputs.target || 'production' }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      url: ${{ steps.target.outputs.url }}
      environment: ${{ steps.target.outputs.environment }}
    steps:
      - name: Resolve target
        id: target
        run: |
          TARGET="${{ github.event.inputs.target || 'production' }}"
          if [ "$TARGET" = "production" ]; then
            echo "environment=production" >> "$GITHUB_OUTPUT"
            echo "url=https://jetnine.com" >> "$GITHUB_OUTPUT"
            echo "env_flag=" >> "$GITHUB_OUTPUT"
          else
            echo "environment=staging" >> "$GITHUB_OUTPUT"
            echo "url=https://staging.jetnine.com" >> "$GITHUB_OUTPUT"
            echo "env_flag=--env staging" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Staging only (OPS-99): apply the D1 migrations to staging's own
      # database with the repo's own deploy token, then print the table count
      # so the run log is the proof. The production path is unchanged.
      - name: D1 migrations (staging)
        if: steps.target.outputs.environment == 'staging'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          pnpm exec wrangler d1 migrations apply jetnine-staging --env staging --remote
          N=$(pnpm exec wrangler d1 execute jetnine-staging --env staging --remote --json --command "select count(*) as n from sqlite_master where type='table' and name not like 'sqlite_%' and name not like '_cf_%' and name != 'd1_migrations'" | jq -r '.[0].results[0].n')
          echo "D1 jetnine-staging tables: $N"

      - name: Build (OpenNext)
        env:
          # Prerendered pages read the database at build time (social links,
          # empty-leg board, sitemap), as they did on Vercel. Transaction
          # pooler URL, the same value as the DATABASE_URL Worker secret.
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DEPLOY_ENV: ${{ steps.target.outputs.environment }}
          NEXT_PUBLIC_DEPLOY_ENV: ${{ steps.target.outputs.environment }}
          NEXT_PUBLIC_GIT_COMMIT_SHA: ${{ github.sha }}
          NEXT_PUBLIC_SITE_URL: ${{ steps.target.outputs.url }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_POSTHOG_KEY: ${{ vars.NEXT_PUBLIC_POSTHOG_KEY }}
          NEXT_PUBLIC_SENTRY_DSN: ${{ vars.NEXT_PUBLIC_SENTRY_DSN }}
          NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION: ${{ vars.NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION }}
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
        run: pnpm cf:build

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # The deploy command starts a local proxy that refuses to load a
          # Hyperdrive binding without a local connection string. It is only
          # parsed, never connected to.
          CLOUDFLARE_HYPERDRIVE_LOCAL_CONNECTION_STRING_HYPERDRIVE: postgresql://placeholder:placeholder@127.0.0.1:5432/placeholder
        run: >-
          pnpm exec opennextjs-cloudflare deploy ${{ steps.target.outputs.env_flag }}
          --var GIT_COMMIT_SHA:${{ github.sha }}

      # The small Worker that owns the hostnames and caches public pages
      # (edge/worker.ts). Deployed after the app with the released commit,
      # so its cache starts empty and never serves the previous build's HTML.
      - name: Deploy edge cache Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >-
          pnpm exec wrangler deploy -c edge/wrangler.jsonc
          ${{ steps.target.outputs.env_flag || '--env ""' }}
          --var APP_VERSION:${{ github.sha }}

  # The monitor Worker (monitor/, OPS-60): checks the site from outside every
  # 15 minutes and serves /status. Its own job so a failure here never marks
  # the app deploy as failed halfway. Same two secrets as the edge step.
  monitor:
    needs: deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Deploy monitor Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DEPLOY_ENVIRONMENT: ${{ needs.deploy.outputs.environment }}
        run: |
          if [ "$DEPLOY_ENVIRONMENT" = "production" ]; then
            pnpm exec wrangler deploy -c monitor/wrangler.jsonc --env ""
          else
            pnpm exec wrangler deploy -c monitor/wrangler.jsonc --env staging
          fi

  smoke:
    needs: deploy
    uses: ./.github/workflows/smoke-after-deploy.yml
    with:
      url: ${{ needs.deploy.outputs.url }}
      sha: ${{ github.sha }}
      environment: ${{ needs.deploy.outputs.environment }}
    secrets: inherit

  sitemap:
    needs: deploy
    if: needs.deploy.outputs.environment == 'production'
    uses: ./.github/workflows/sitemap-monitor.yml
