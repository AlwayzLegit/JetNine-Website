name: Deploy (Cloudflare)

# Builds the app with the OpenNext adapter and deploys it to Cloudflare
# Workers, then runs the same post-deploy smoke Vercel deploys trigger.
#
#   push to main       → production  (jetnine-web, jetnine.com)
#   workflow_dispatch  → staging or production
#
# Repository secrets:   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID,
#                       NEXT_PUBLIC_SUPABASE_ANON_KEY, DATABASE_URL
# Repository variables: NEXT_PUBLIC_SUPABASE_URL, NEXT_PUBLIC_POSTHOG_KEY,
#                       NEXT_PUBLIC_SENTRY_DSN, NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION
# NEXT_PUBLIC_* values are inlined at build time, so they belong here and
# not only in the Worker's vars/secrets.

on:
  push:
    branches: [main]
    paths-ignore: ["voice/**", "**/*.md", "docs/**"]
  workflow_dispatch:
    inputs:
      target:
        description: Where to deploy
        type: choice
        options: [staging, production]
        default: staging

permissions:
  contents: read
  # smoke-after-deploy.yml asks for this; a called workflow may not request
  # more than its caller grants, or the whole run fails at startup.
  deployments: read

concurrency:
  group: deploy-cloudflare-${{ github.event.inputs.target || 'production' }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      url: ${{ steps.target.outputs.url }}
      environment: ${{ steps.target.outputs.environment }}
    steps:
      - name: Resolve target
        id: target
        run: |
          TARGET="${{ github.event.inputs.target || 'production' }}"
          if [ "$TARGET" = "production" ]; then
            echo "environment=production" >> "$GITHUB_OUTPUT"
            echo "url=https://jetnine.com" >> "$GITHUB_OUTPUT"
            echo "env_flag=" >> "$GITHUB_OUTPUT"
          else
            echo "environment=staging" >> "$GITHUB_OUTPUT"
            echo "url=https://staging.jetnine.com" >> "$GITHUB_OUTPUT"
            echo "env_flag=--env staging" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build (OpenNext)
        env:
          # Prerendered pages read the database at build time (social links,
          # empty-leg board, sitemap), as they did on Vercel. Transaction
          # pooler URL, the same value as the DATABASE_URL Worker secret.
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DEPLOY_ENV: ${{ steps.target.outputs.environment }}
          NEXT_PUBLIC_DEPLOY_ENV: ${{ steps.target.outputs.environment }}
          NEXT_PUBLIC_GIT_COMMIT_SHA: ${{ github.sha }}
          NEXT_PUBLIC_SITE_URL: ${{ steps.target.outputs.url }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_POSTHOG_KEY: ${{ vars.NEXT_PUBLIC_POSTHOG_KEY }}
          NEXT_PUBLIC_SENTRY_DSN: ${{ vars.NEXT_PUBLIC_SENTRY_DSN }}
          NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION: ${{ vars.NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION }}
        run: pnpm cf:build

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >-
          pnpm exec opennextjs-cloudflare deploy ${{ steps.target.outputs.env_flag }}
          --var GIT_COMMIT_SHA:${{ github.sha }}

  smoke:
    needs: deploy
    uses: ./.github/workflows/smoke-after-deploy.yml
    with:
      url: ${{ needs.deploy.outputs.url }}
      sha: ${{ github.sha }}
      environment: ${{ needs.deploy.outputs.environment }}
    secrets: inherit

  sitemap:
    needs: deploy
    if: needs.deploy.outputs.environment == 'production'
    uses: ./.github/workflows/sitemap-monitor.yml
