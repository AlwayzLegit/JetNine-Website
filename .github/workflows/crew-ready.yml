name: Crew ready

# When CI passes on the current head of a crew/ pull request, put the label crew-ready on it.
# The label starts the Crew's Merge captain task 3c. Own token, pull requests only; no secret.

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'pull_request' && startsWith(github.event.workflow_run.head_branch, 'crew/')
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Label the pull request
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          PR: ${{ github.event.workflow_run.pull_requests[0].number }}
        run: |
          [ -n "$PR" ] || { echo "no pull request on this run"; exit 0; }
          head=$(gh api "repos/$REPO/pulls/$PR" --jq .head.sha)
          [ "$head" = "$HEAD_SHA" ] || { echo "stale run: head is $head"; exit 0; }
          gh api -X DELETE "repos/$REPO/issues/$PR/labels/crew-ready" 2>/dev/null || true
          gh api -X POST "repos/$REPO/issues/$PR/labels" -f 'labels[]=crew-ready'
          echo "labeled #$PR crew-ready at $HEAD_SHA"
