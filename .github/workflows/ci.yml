name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: lint · typecheck · build
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint
        continue-on-error: false

      - name: Typecheck
        run: pnpm typecheck

      # API invariants (tokens, scopes, SSRF classifier, route registry,
      # OpenAPI) — no database needed.
      - name: API checks
        run: pnpm check:api

      - name: Sitemap invariants
        run: |
          pnpm check:sitemap
          python3 scripts/test-live-sitemap.py

      # Build is the canonical check — catches Next.js / Drizzle issues that
      # lint + typecheck miss. Env values come from GitHub secrets when set;
      # the build's runtime code falls back to dummy values when env is
      # missing so it can compile without contacting Supabase.
      # Builds the Next app and the Cloudflare Worker bundle (OpenNext).
      # Runs here on Linux because OpenNext's Windows builds are unreliable.
      - name: Build (Next + Worker)
        run: pnpm cf:build
        env:
          # Dummy values let next build succeed without DB access. Real
          # values are required for the deployed app, not for the CI build.
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
          SUPABASE_SERVICE_ROLE_KEY: ci-placeholder
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
          DIRECT_URL: postgresql://ci:ci@localhost:5432/ci

      # Bundles worker.ts + the OpenNext output the way `wrangler deploy`
      # would and prints the upload size (Workers Paid limit: 10 MB gzip),
      # without credentials or touching any account.
      - name: Worker bundle dry run
        run: pnpm exec wrangler deploy --dry-run --outdir .wrangler/dry-run

      # The edge cache Worker must stay tiny: its start-up time is its purpose.
      - name: Edge Worker bundle dry run
        run: pnpm exec wrangler deploy -c edge/wrangler.jsonc --env "" --dry-run

      # The monitor Worker (monitor/, OPS-60): its tests and a bundle dry run.
      - name: Monitor tests
        run: node --test monitor/monitor.test.mjs

      # App-made codes and updated_at (OPS-101): format, UTC year, the upsert, the call sites.
      - name: Codes and updated-at tests
        run: pnpm exec tsx --test src/db/codes.test.ts

      - name: Monitor Worker bundle dry run
        run: pnpm exec wrangler deploy -c monitor/wrangler.jsonc --env "" --dry-run

      # Business rules that Postgres triggers used to run, now in the app (OPS-102):
      # the aircraft schedule block, the member tier and the role lock.
      - name: Trigger-logic tests
        run: pnpm exec tsx --test src/domain/trips/schedule-block.test.ts src/domain/memberships/tier.test.ts src/lib/role-lock.test.ts

      # The Supabase Auth probe behind /api/health's "auth" check (OPS-90).
      - name: Auth probe tests
        run: node --test src/lib/auth-probe.test.mjs

      # The site's own sessions (OPS-91): token, hash, cookie and timeout rules.
      - name: Session tests
        run: node --test src/lib/session/core.test.mjs

      # Emailed links (OPS-94): token lifetime, one use, link origin and next.
      - name: Auth token tests
        run: node --test src/lib/auth-tokens/core.test.mjs

      # Who a desk alert goes to (OPS-103): the shared inbox first, staff after.
      - name: Desk alert recipient tests
        run: node --test src/lib/desk-alert-recipients.test.mjs

      # The D1 tables stay a faithful twin of the Postgres ones (OPS-100).
      - name: D1 schema parity test
        run: pnpm exec tsx --test src/db/d1/parity.test.ts

      # Post-deploy checks (OPS-104): the retry rule of the smoke reads and the
      # tail summary that never prints a query string, header or message.
      - name: Smoke read retry tests
        run: pnpm exec tsx --test scripts/smoke-fetch.test.mts

      - name: Deploy tail summary tests
        run: node --test scripts/deploy-tail/summarize.test.mjs

      # The reference store on D1 (operators, aircraft, airports, FBOs): contract cases on a
      # real SQLite, and the loud failure when the target is d1 with no binding (OPS-112).
      - name: Reference store tests
        run: pnpm exec tsx --test src/domain/reference/store-d1.test.ts

      # The empty-legs store on D1: contract cases on a real SQLite (the EL code and its
      # insert as one batch, the rollback), the code SQL against formatCode, and the loud
      # failure when the target is d1 with no binding (OPS-113).
      - name: Empty legs store tests
        run: pnpm exec tsx --test src/domain/empty-legs/store-d1.test.ts

      # The empty-leg watchlist store on D1: contract cases on a real SQLite (confirm links,
      # STOP and START, unsubscribe, the delivery ledger and its chunked read) and the
      # loud failure when the target is d1 with no binding (OPS-116).
      - name: Watchlist store tests
        run: pnpm exec tsx --test src/domain/empty-legs/watchlist-store-d1.test.ts

      # The Postgres to staging D1 copy tool (OPS-105): value mapping, the staging-only
      # guard, the table plan and the held-back credential tables. Needs no database.
      - name: D1 copy tests
        run: |
          node --test scripts/d1-copy/map.test.mjs
          pnpm exec tsx --test scripts/d1-copy/tables.test.ts

      # The blog store on D1: contract cases on a real SQLite, and the loud failure
      # when the target is d1 with no binding (OPS-109).
      - name: Blog store tests
        run: pnpm exec tsx --test src/domain/blog/store-d1.test.ts src/domain/blog/store.test.ts

      # The inquiry store on D1 (the contact form, the guide download leads, the desk count and
      # the admin Website form tab): contract cases on a real SQLite, and the loud failure when
      # the target is d1 with no binding (OPS-122).
      - name: Contact store tests
        run: pnpm exec tsx --test src/domain/contact/store-d1.test.ts src/domain/contact/store.test.ts

      # The audit log and the rate limiter on D1 (OPS-123): the limiter's one upsert and its
      # windows, the audit append (and logAudit never throwing), and Settings > History's read
      # side (tabs, search, subject names), on a real SQLite, plus the loud failure when the
      # target is d1 with no binding.
      - name: Audit and rate limit store tests
        run: pnpm exec tsx --test src/lib/rate-limit-d1.test.ts src/lib/audit-store.test.ts src/domain/history/store-d1.test.ts src/domain/history/store.test.ts

      # The desk settings and the voice agent configs on D1 (OPS-126): the key/value settings,
      # a person's notification choices and who gets paged, and the agents with their versions
      # (create, save with the version check, make live, archive), on a real SQLite with
      # atomic batches, plus the loud failure when the target is d1 with no binding.
      - name: Settings store tests
        run: pnpm exec tsx --test src/domain/settings/store-d1.test.ts src/domain/settings/store.test.ts src/domain/voice-agents/store-d1.test.ts src/domain/voice-agents/store.test.ts

      # The desk's messages on D1 (OPS-127): the inbox threads (newest first, unread counts, the
      # latest message of each thread), one thread, failed deliveries, mark read, the desk counts,
      # emails sent in the Los Angeles day (with its daylight saving edges), a member's trip
      # timeline, the webhooks' writes and the inbound duplicate guard, on a real SQLite, plus the
      # loud failure when the target is d1 with no binding.
      - name: Message store tests
        run: pnpm exec tsx --test src/domain/messages/store-d1.test.ts src/domain/messages/store.test.ts

      # Clients and memberships on D1 (OPS-149): the desk's client list (case-insensitive search,
      # the per-client counts and the reserve balance) and detail, the reserve ledger add and its
      # balance, the invite taking the next M code in one batch (a failed insert gives the number
      # back), the membership writes with the tier following them, preferences, companions and
      # lanes, and the five money-path guard indexes (one active membership per member, one
      # top-up per payment intent, one refund per draw), on a real SQLite, plus the loud failure
      # when the target is d1 with no binding.
      - name: Member store tests
        run: pnpm exec tsx --test src/domain/members/store-d1.test.ts src/domain/members/store.test.ts

      # The API keys on D1 (OPS-138): create with the cap of working keys (one statement, two
      # creates together at the cap give one key), revoke, the list with its 24 hour counts and the
      # creator's name and role, the /api/v1 key sign-in read, the 60 second last-used stamp, one
      # key's limits, the request log and its 30 day clean-up, the old blog key's usage, and the
      # table's own refusals (unknown scope, unsupervised agent key, duplicate prefix), on a real
      # SQLite, plus the loud failure when the target is d1 with no binding.
      - name: API key store tests
        run: pnpm exec tsx --test src/lib/api-key-store/store-d1.test.ts src/lib/api-key-store/store.test.ts

      # The desk assistant on D1 (OPS-142): playbook versions (the next version in one statement),
      # runs (one open run per key, stale and left-open sweeps, the list with item counts), run
      # items (the cap of 100 and the one open flag per subject as one conditional insert, a
      # dismiss), and memory (the 200 item cap and the per-run cap, the archive), on a real SQLite
      # with the repo's D1 migrations, plus the loud failure when the target is d1 with no binding.
      - name: Agent store tests
        run: pnpm exec tsx --test src/domain/agent/store-d1.test.ts src/domain/agent/store.test.ts

      # The assistant's approvals on D1 (OPS-150): one pending proposal per dedupe key (the second
      # insert is refused by the partial unique index and the first handed back), the conditional
      # claim (a second caller gets nothing), the final write, the expiry sweep (pending past
      # expiry, an executing row stuck over an hour), the 24 hour per-key window, the joined lists
      # and counts and what was decided since a date, on a real SQLite with the repo's D1
      # migrations, plus the loud failure when the target is d1 with no binding.
      - name: Approval store tests
        run: pnpm exec tsx --test src/domain/approvals/store-d1.test.ts src/domain/approvals/store.test.ts

      # The phone line's call notes on D1 (OPS-129): the Calls tab's read (newest calls first, the
      # limit, the latest message of each call, the types the tab expects), the four voice tables'
      # constraints and foreign keys, on a real SQLite, plus the loud failure when the target is d1
      # with no binding. The D1 parity test (above) and the copy plan test (scripts/d1-copy) also
      # cover the four tables.
      - name: Voice call notes store tests
        run: pnpm exec tsx --test src/domain/voice/call-notes-store-d1.test.ts src/domain/voice/call-notes-store.test.ts

      # The public quote and the request page on D1 (OPS-153): the quote wizard's submit (the JN code
      # from the counter in the same batch, the missing airports, the legs, a second submit with the
      # same idempotency key refused by the new unique index and rolled back whole, number included),
      # the request page's reads (legs, options, dispatcher, trip) and the client's pick (one claim,
      # a second claim and a same-millisecond claim change nothing, a re-opened quote takes a fair new
      # pick), on a real SQLite with the repo's D1 migrations and a batch that is one transaction, plus
      # the loud failure when the target is d1 with no binding.
      - name: Quote store tests
        run: pnpm exec tsx --test src/domain/quotes/store-d1.test.ts src/domain/quotes/store.test.ts

      # The desk's request reads on D1 (OPS-154): the request list (open, booked within 14 days,
      # closed within 30, smoke quotes hidden, search by name, email, leg city with % and _ literal),
      # legs and option counts across chunks of 50, the one-request page's parts and candidate
      # aircraft, the SLA watch's claim (one claim per quote, the limit, the 24 hour window) and its
      # due-soon list, the smoke prune (the guard repeated in every statement, in batches) and the
      # reports export, on a real SQLite with the repo's D1 migrations and a batch that is one
      # transaction, plus the loud failure when the target is d1 with no binding and the export's
      # window start.
      - name: Request store tests
        run: pnpm exec tsx --test src/domain/requests/store-d1.test.ts src/domain/requests/store.test.ts src/app/admin/settings/reports/period.test.ts

      # The trips and the aircraft calendar on D1 (OPS-156): the trip list (newest first, the limit,
      # search by last name, email and leg city with % and _ literal), legs, invoices and options
      # across chunks of 50, the one-trip page's parts, the status write with its schedule block
      # (made for a trip with an aircraft and times, moved, removed on a cancellation), the manual
      # blocks, the client's trip pages (no row for another client's trip), the aircraft page's
      # window, recent trips and totals, and the status notice's reads, on a real SQLite with the
      # repo's D1 migrations, plus the loud failure when the target is d1 with no binding.
      - name: Trip store tests
        run: pnpm exec tsx --test src/domain/trips/store-d1.test.ts src/domain/trips/store.test.ts

  # The voice Worker (voice/, OPS-137): its own package, its own lockfile. Typecheck and
  # the Worker tests run inside workerd, among them the store tests on a real D1
  # (test/store-d1.test.ts, the site's D1 migrations applied). No secrets, no network.
  voice:
    name: voice Worker · typecheck · test
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: voice/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: voice
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        working-directory: voice
        run: pnpm typecheck

      - name: Test
        working-directory: voice
        run: pnpm test --reporter=verbose

  e2e:
    name: playwright smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Build app for smoke run
        run: pnpm build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
          SUPABASE_SERVICE_ROLE_KEY: ci-placeholder
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
          DIRECT_URL: postgresql://ci:ci@localhost:5432/ci

      - name: Run smoke suite
        run: pnpm e2e
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
          SUPABASE_SERVICE_ROLE_KEY: ci-placeholder
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
          DIRECT_URL: postgresql://ci:ci@localhost:5432/ci

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
