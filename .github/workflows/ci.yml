name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: lint · typecheck · build
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint
        continue-on-error: false

      - name: Typecheck
        run: pnpm typecheck

      # API invariants (tokens, scopes, SSRF classifier, route registry,
      # OpenAPI) — no database needed.
      - name: API checks
        run: pnpm check:api

      - name: Sitemap invariants
        run: |
          pnpm check:sitemap
          python3 scripts/test-live-sitemap.py

      # Build is the canonical check — catches Next.js / Drizzle issues that
      # lint + typecheck miss. Env values come from GitHub secrets when set;
      # the build's runtime code falls back to dummy values when env is
      # missing so it can compile without contacting Supabase.
      # Builds the Next app and the Cloudflare Worker bundle (OpenNext).
      # Runs here on Linux because OpenNext's Windows builds are unreliable.
      - name: Build (Next + Worker)
        run: pnpm cf:build
        env:
          # Dummy values let next build succeed without DB access. Real
          # values are required for the deployed app, not for the CI build.
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
          SUPABASE_SERVICE_ROLE_KEY: ci-placeholder
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
          DIRECT_URL: postgresql://ci:ci@localhost:5432/ci

      # Bundles worker.ts + the OpenNext output the way `wrangler deploy`
      # would and prints the upload size (Workers Paid limit: 10 MB gzip),
      # without credentials or touching any account.
      - name: Worker bundle dry run
        run: pnpm exec wrangler deploy --dry-run --outdir .wrangler/dry-run

      # The edge cache Worker must stay tiny: its start-up time is its purpose.
      - name: Edge Worker bundle dry run
        run: pnpm exec wrangler deploy -c edge/wrangler.jsonc --env "" --dry-run

      # The edge Worker's failure log (OPS-195): one short line when the app throws or answers 5xx,
      # the visitor's answer unchanged, and no query string, cookie, header or quote in the line.
      - name: Edge Worker tests
        run: pnpm exec tsx --test edge/worker.test.ts

      # The monitor Worker (monitor/, OPS-60): its tests and a bundle dry run.
      - name: Monitor tests
        run: node --test monitor/monitor.test.mjs

      # App-made codes and updated_at (OPS-101): format, UTC year, the upsert, the call sites.
      - name: Codes and updated-at tests
        run: pnpm exec tsx --test src/db/codes.test.ts

      - name: Monitor Worker bundle dry run
        run: pnpm exec wrangler deploy -c monitor/wrangler.jsonc --env "" --dry-run

      # Business rules that Postgres triggers used to run, now in the app (OPS-102):
      # the aircraft schedule block, the member tier and the role lock.
      - name: Trigger-logic tests
        run: pnpm exec tsx --test src/domain/trips/schedule-block.test.ts src/domain/memberships/tier.test.ts src/lib/role-lock.test.ts src/lib/desk-alert-audit.test.ts

      # The Supabase Auth probe behind /api/health's "auth" check (OPS-90).
      - name: Auth probe tests
        run: node --test src/lib/auth-probe.test.mjs

      # The site's own sessions (OPS-91): token, hash, cookie and timeout rules.
      - name: Session tests
        run: node --test src/lib/session/core.test.mjs

      # Emailed links (OPS-94): token lifetime, one use, link origin and next.
      - name: Auth token tests
        run: node --test src/lib/auth-tokens/core.test.mjs

      # Who a desk alert goes to (OPS-103): the shared inbox first, staff after.
      - name: Desk alert recipient tests
        run: node --test src/lib/desk-alert-recipients.test.mjs

      - name: Write pause tests
        # The write pause for the database cutover (OPS-205).
        run: node --test src/lib/writes-pause.test.mjs

      - name: Database target tests
        # The production cutover switch (OPS-176) and the list of Postgres call sites left.
        run: |
          node --test src/db/target.test.mjs src/db/wrangler-d1.test.mjs
          pnpm exec tsx --test src/db/postgres-left.test.ts
          pnpm exec tsx --test src/lib/health-db.test.ts

      # The D1 tables stay a faithful twin of the Postgres ones (OPS-100).
      - name: D1 schema parity test
        run: pnpm exec tsx --test src/db/d1/parity.test.ts

      # Post-deploy checks (OPS-104): the retry rule of the smoke reads and the
      # tail summary that never prints a query string, header or message.
      - name: Smoke read retry tests
        run: pnpm exec tsx --test scripts/smoke-fetch.test.mts

      # The smoke's rule for the write pause of the cutover window (OPS-211): 503 with the
      # pause header passes on a writing check, anything else fails.
      - name: Smoke write pause tests
        run: pnpm exec tsx --test scripts/smoke-paused.test.mts

      - name: Deploy tail summary tests
        run: node --test scripts/deploy-tail/summarize.test.mjs

      # The Worker errors report (OPS-168): the redaction, the window limit, the 401 and 403 line,
      # the grouping, and that no query string, header, address, token or account id is printed.
      - name: Worker errors report tests
        run: node --test scripts/worker-errors/query.test.mjs

      # The warm-up gate of Deploy (Cloudflare) (OPS-175): three answers in a row, health must
      # say ok, a thrown error or a cut body is a failed read, nothing but a status label printed.
      - name: Deploy warm-up tests
        run: node --test scripts/deploy-warm/warm.test.mjs

      # The Postgres to staging D1 copy tool (OPS-105): value mapping, the staging-only
      # guard, the table plan and the held-back credential tables. Needs no database.
      - name: D1 copy tests
        run: |
          node --test scripts/d1-copy/map.test.mjs scripts/d1-copy/reverse-map.test.mjs
          pnpm exec tsx --test scripts/d1-copy/tables.test.ts

      # Every store test of the D1 move in one step (OPS-170): scripts/ci/store-tests.mjs finds the
      # files by name (store.test.ts, store-d1.test.ts, *-store.test.ts, *-store-d1.test.ts, the
      # src/lib/*-d1.test.ts files and the reports period test), prints the list and the count, and fails
      # if a file CI ran before is no longer found. A new store adds a test file and no line here.
      - name: D1 store tests
        run: node scripts/ci/store-tests.mjs

      # The runner's own matching and guard.
      - name: D1 store test runner tests
        run: node --test scripts/ci/store-tests.test.mjs

  # The copy rehearsal (OPS-198): the repo's 58 Postgres migrations replayed on a throwaway Postgres
  # (supabase-stubs.sql stands in for what Supabase gives a project), a made-up fixture loaded with
  # every trigger on, then the copy (target staging, mode rehearse) from it into an in-memory D1 with
  # the counts and checksums read back. It uses no secret and reaches nothing outside the runner:
  # the scripts refuse any host but localhost. It is the test bed of the reverse copy (OPS-93, 8b3b).
  # postgres:15 is an assumption about JetNine's Supabase major version (DEPLOY.md).
  copy-rehearsal:
    name: Copy rehearsal
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The guards: no host but localhost, no target but staging, no password in a message.
      - name: Rehearsal guard tests
        run: node --test scripts/d1-copy/rehearsal/local.test.mjs

      - name: Apply the migrations
        run: node scripts/d1-copy/rehearsal/apply.mjs

      - name: Load the fixture
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 --single-transaction -q -f scripts/d1-copy/rehearsal/fixture.sql

      - name: Copy into an in-memory D1 and compare
        run: pnpm exec tsx scripts/d1-copy/copy.mjs --target staging --mode rehearse

      # The way back (OPS-200): the same data into a production-shaped in-memory D1, four writes made
      # there as after the cutover, the preflight read, a failing load rolled back, then the load into
      # this Postgres with triggers off, and the round trip checked. Ends with the line
      # "reverse rehearsal: N tables, 0 with a difference, round trip equal". Last step: it changes
      # this throwaway database. It reads no Cloudflare variable and refuses any host but localhost.
      - name: Reverse copy, D1 back into Postgres (rehearsal)
        run: pnpm exec tsx scripts/d1-copy/reverse.mjs --mode rehearse

  # The voice Worker (voice/, OPS-137): its own package, its own lockfile. Typecheck and
  # the Worker tests run inside workerd, among them the store tests on a real D1
  # (test/store-d1.test.ts, the site's D1 migrations applied). No secrets, no network.
  voice:
    name: voice Worker · typecheck · test
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: voice/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: voice
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        working-directory: voice
        run: pnpm typecheck

      - name: Test
        working-directory: voice
        run: pnpm test --reporter=verbose

      - name: Bundle dry run
        # Builds the Worker with the config as it is, no credentials, nothing uploaded
        # (OPS-196). The log lists the bindings, among them DB on jetnine-production.
        working-directory: voice
        run: pnpm exec wrangler deploy --dry-run --outdir .wrangler/dry-run

  e2e:
    name: playwright smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        # The runner already has Chromium's libraries, so install only the
        # browser. "--with-deps" also pulled fonts from an apt mirror that ran
        # at 65 kB/s and cancelled 3 smoke jobs on 2026-11-18 (OPS-199).
        # Fall back to the system packages only if Chromium cannot start.
        run: |
          pnpm exec playwright install chromium
          if ! node -e "require('@playwright/test').chromium.launch().then(b => b.close())"; then
            echo "::warning::Chromium did not start without system packages; installing them"
            pnpm exec playwright install-deps chromium
          fi

      - name: Build app for smoke run
        run: pnpm build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
          SUPABASE_SERVICE_ROLE_KEY: ci-placeholder
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
          DIRECT_URL: postgresql://ci:ci@localhost:5432/ci

      - name: Run smoke suite
        run: pnpm e2e
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
          SUPABASE_SERVICE_ROLE_KEY: ci-placeholder
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
          DIRECT_URL: postgresql://ci:ci@localhost:5432/ci

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
