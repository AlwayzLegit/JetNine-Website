name: D1 copy

# Copies JetNine's Postgres into a D1 database and checks the copy (OPS-105, step 5
# of the move to Cloudflare, OPS-93). Run by hand only. Postgres is only read, in one
# read-only snapshot.
#
# Target staging (the default) wipes and fills jetnine-staging; the credential tables
# (password hashes, session and API key hashes, provider keys) are not copied there.
# Target production (OPS-197) is the cutover's, on the owner's yes: a load writes
# jetnine-production, with password hashes, bans, sessions, API keys and provider keys
# as stored, and it refuses unless "confirm" is exactly copy-to-production and production
# D1 is empty (or "replace" is exactly replace-production-d1). It runs only from main.
# Mode preflight reads and checks everything and writes nothing, on either target.
#
# The log lists every table with its Postgres and D1 row counts and "checksum equal
# yes or no". It prints no row values. Uses the repo's own secrets DATABASE_URL,
# CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID.
# Details: DEPLOY.md "Copy Postgres to staging D1 (OPS-105)" and "Production target (OPS-197)".

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Which D1 database: staging, or production (only from main; a load needs the typed confirm)"
        type: choice
        options: [staging, production]
        default: staging
      mode:
        description: "load = wipe, load and check; check = only compare counts and checksums; preflight = read and check, write nothing"
        type: choice
        options: [load, check, preflight]
        default: load
      confirm:
        description: "Production load only: type copy-to-production"
        type: string
        default: ""
      replace:
        description: "Production load into a D1 that holds rows: type replace-production-d1"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: d1-copy
  cancel-in-progress: false

jobs:
  copy:
    name: copy Postgres to ${{ github.event.inputs.target }} D1
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Production runs only from main
        env:
          TARGET: ${{ github.event.inputs.target }}
          REF: ${{ github.ref }}
        run: |
          if [ "$TARGET" = "production" ] && [ "$REF" != "refs/heads/main" ]; then
            echo "refused: target production runs only from main"
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Apply the D1 migrations to the target
        # A preflight writes nothing, so it applies nothing, and a production check only reads. A
        # production load applies them to jetnine-production (top-level config, no --env), the same as
        # the app deploy's job.
        if: ${{ github.event.inputs.mode == 'load' || (github.event.inputs.mode == 'check' && github.event.inputs.target == 'staging') }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TARGET: ${{ github.event.inputs.target }}
        run: |
          if [ "$TARGET" = "production" ]; then
            pnpm exec wrangler d1 migrations apply jetnine-production --remote
          else
            pnpm exec wrangler d1 migrations apply jetnine-staging --env staging --remote
          fi

      - name: Copy and check
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TZ: UTC
          MODE: ${{ github.event.inputs.mode }}
          TARGET: ${{ github.event.inputs.target }}
          # Typed inputs go through the environment, never the command line (a process list shows argv).
          CONFIRM: ${{ github.event.inputs.confirm }}
          REPLACE: ${{ github.event.inputs.replace }}
        run: |
          pnpm exec tsx scripts/d1-copy/copy.mjs --target "$TARGET" --mode "$MODE"
