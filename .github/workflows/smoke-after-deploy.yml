name: Post-deploy smoke

# Runs only when Deploy (Cloudflare) calls it (workflow_call), with the URL
# that deploy just published. It runs `pnpm smoke` and a browser walk of the
# quote and contact forms against that URL, which catches regressions that
# local tests cannot see (CDN, CSP, env vars, routing).
#
# It no longer listens to deployment_status events from Vercel (OPS-251).
# After the cutover to D1 (OPS-206) the Vercel copy of the site is not the
# site: it is built from vercel.json, never reads wrangler.jsonc, so neither
# DB_TARGET nor the write pause reach it, and its smoke wrote [SMOKE] quotes
# and a contact inquiry to Postgres on every deploy, Production and Preview.
# To undo: put the `deployment_status:` trigger back (a revert).

on:
  workflow_call:
    inputs:
      url:
        type: string
        required: true
      sha:
        type: string
        required: true
      environment:
        type: string
        required: true

permissions:
  contents: read
  deployments: read

jobs:
  smoke:
    name: smoke ${{ inputs.environment }}
    if: inputs.url != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Resolve deployment URL
        id: resolve
        run: |
          URL="${{ inputs.url }}"
          if [ -z "$URL" ]; then
            echo "::warning::No deployment URL passed in - nothing to smoke."
            exit 1
          fi
          # Strip trailing slash so the smoke runner's path concatenation
          # produces clean URLs like https://host/sitemap.xml not //sitemap.
          URL="${URL%/}"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Resolved smoke target: $URL"

      - name: Reachability probe (HEAD /)
        # Quick sanity check that the resolved URL is publicly reachable
        # before we sink time into pnpm install + smoke runner.
        # -L follow redirects, -I HEAD, -o /dev/null discard body,
        # -w print status, -s silent, --max-time 15.
        run: |
          URL="${{ steps.resolve.outputs.url }}"
          echo "Probing: $URL"
          status=$(curl -sLI -o /dev/null -w '%{http_code}' --max-time 15 "$URL" || echo "curl_failed")
          echo "HEAD / → $status"
          if [ "$status" = "200" ]; then
            echo "✓ Public + 200, proceeding to full smoke."
          elif [ "$status" = "401" ] || [ "$status" = "403" ]; then
            echo "::error::Preview returned $status — deployment protection still on, or wrong URL resolved. Bypass token (VERCEL_AUTOMATION_BYPASS_SECRET) is the standard fix."
            exit 1
          else
            echo "::error::Unexpected HEAD response $status from $URL - check the resolved URL above."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The smoke script lives in the same commit that triggered the
          # deploy. Deploy (Cloudflare) passes the sha in inputs.sha.
          ref: ${{ inputs.sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run production smoke (HTTP)
        id: http-smoke
        env:
          BASE_URL: ${{ steps.resolve.outputs.url }}
          # Preview deploys behind Vercel Authentication need a bypass
          # token. Generate one in Project Settings → Deployment
          # Protection → Protection Bypass for Automation, then add
          # to repo secrets as VERCEL_AUTOMATION_BYPASS_SECRET.
          # Production deploys typically aren't gated, so this is
          # optional — secret missing = no header sent = still works
          # against public prod URLs.
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: pnpm smoke

      # The write pause of the cutover window (OPS-205, OPS-211): while the home
      # page carries x-jetnine-writes: paused, the site refuses every write with 503
      # on purpose, so the quote walk below could only fail. It is skipped with one
      # line, and the HTTP smoke above already expects 503 on the writing checks.
      # Unpaused (header absent), nothing changes and the walk runs.
      - name: Writes paused?
        id: pause
        run: |
          URL="${{ steps.resolve.outputs.url }}"
          if curl -sI --max-time 15 "$URL/" | grep -qi '^x-jetnine-writes: *paused'; then
            echo "paused=true" >> "$GITHUB_OUTPUT"
            echo "writes paused: quote walk skipped"
          else
            echo "paused=false" >> "$GITHUB_OUTPUT"
          fi

      # Tier 4: real browser walk of the quote wizard against the
      # deployed URL. Submits a [SMOKE]-flagged quote that submitQuote
      # auto-cancels server-side, so dispatch doesn't get paged.
      - name: Install Playwright browsers
        if: steps.pause.outputs.paused != 'true'
        # The runner already has Chromium's libraries, so install only the
        # browser. "--with-deps" also pulled fonts from an apt mirror that ran
        # at 65 kB/s and cancelled 3 smoke jobs on 2026-11-18 (OPS-199).
        # Fall back to the system packages only if Chromium cannot start.
        run: |
          pnpm exec playwright install chromium
          if ! node -e "require('@playwright/test').chromium.launch().then(b => b.close())"; then
            echo "::warning::Chromium did not start without system packages; installing them"
            pnpm exec playwright install-deps chromium
          fi

      - name: Run production smoke (Playwright)
        if: steps.pause.outputs.paused != 'true'
        env:
          BASE_URL: ${{ steps.resolve.outputs.url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: pnpm smoke:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: prod-smoke-report-${{ inputs.environment }}
          path: playwright-report/
          retention-days: 7

      - name: Annotate failure
        if: failure()
        run: |
          echo "::error title=Post-deploy smoke failed::Smoke checks failed against ${{ steps.resolve.outputs.url }} — see job log for which checks regressed."
